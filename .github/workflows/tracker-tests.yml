name: FOMO Tracker Test 4

on:
  push:
    branches:
      - feature/fomo-tracker-test-4
    paths:
      - 'tracker/**'
      - 'tests/test_tracker.py'
      - '.github/workflows/tracker-tests.yml'
  pull_request:
    paths:
      - 'tracker/**'
      - 'tests/test_tracker.py'
      - '.github/workflows/tracker-tests.yml'

jobs:
  tracker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated tracker tests
        run: python -m unittest discover -s tests -v
